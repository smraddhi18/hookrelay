[project]
name = "hookrelay"
version = "0.1.0"
description = "Multi-tenant webhook delivery platform: signed, retried, observable HTTP deliveries backed by Postgres."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Smraddhi Rathore" }]
requires-python = ">=3.12,<3.14"
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.160,<1",
    "uvicorn[standard]>=0.50",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.31",
    "alembic>=1.18",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12",
    "structlog>=25.4",
    "cryptography>=46",
    "httpx>=0.28",
    "httpcore>=1.0.9",
    "redis>=5.2,<7",
    "prometheus-client>=0.21,<1",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    # httpcore probes for sniffio on every pool operation; when it is missing each probe is a
    # failed import that walks sys.path (a hot spot in delivery-worker profiles; docs/capacity.md).
    "sniffio>=1.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "asyncpg-stubs>=0.31",
]

[project.scripts]
hookrelay = "hookrelay.__main__:main"
hookrelay-relay = "hookrelay.relay:main"
hookrelay-worker = "hookrelay.worker:main"
hookrelay-retention = "hookrelay.retention:main"
hookrelay-partitions = "hookrelay.partitions:main"
hookrelay-mock-receiver = "hookrelay.mock_receiver:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hookrelay"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["alembic/versions/*.py.mako"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "C4", "RUF", "ASYNC",
    "PT", "RET", "PL", "TRY", "DTZ", "T20", "PERF", "FAST", "ANN",
]
ignore = [
    "PLR0913", # FastAPI handlers / factories legitimately take many args
    "TRY003",  # long messages in exceptions are fine for a typed AppError
    "ANN401",  # Any is needed for a few generic ASGI signatures
]

[tool.ruff.lint.isort]
known-first-party = ["hookrelay", "tests"]
# The local ./alembic directory holds migration scripts, not a package; the import is the library.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "ANN", "S311"]
# Worker-style modules share test_worker's per-test database fixtures by import.
"tests/integration/test_backpressure.py" = ["F811"]
"tests/integration/test_replays.py" = ["F811"]
"tests/integration/test_retention.py" = ["F811"]
"tests/integration/test_secret_rotation.py" = ["F811"]
"tests/integration/test_delivery_search_and_health.py" = ["F811"]
"tests/integration/test_observability.py" = ["F811"]
"tests/integration/test_chaos.py" = ["F811"]
"tests/integration/test_completion_batches.py" = ["F811"]
"tests/integration/test_pgbouncer.py" = ["F811"]
"alembic/**" = ["ANN"]
# DDL takes no bind parameters: identifiers are generated (and quoted) from our own naming
# scheme and the catalog, never from input. Values still go through bind parameters.
"alembic/versions/0011_partition_delivery_attempts.py" = ["ANN", "S608"]
"src/hookrelay/services/partitions.py" = ["S608"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "alembic"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a real Postgres (TEST_DATABASE_URL); skipped when it is not set",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["hookrelay"]
branch = true
# SQLAlchemy's asyncio layer runs ORM code inside greenlets; without this, every line after
# the first awaited DB call in a request would be reported as uncovered.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
