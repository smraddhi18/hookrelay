;; PgBouncer for the compose stack (Milestone 9): transaction pooling in front of Postgres.
;; The API, relays and workers connect here with DB_PGBOUNCER=true; Alembic bypasses it through
;; DATABASE_DIRECT_URL (migrations need session state). Sizing: docs/capacity.md
;; ("Connection budget").

[databases]
;; Server-side guards the clients cannot send as startup parameters through the pooler
;; (PgBouncer refuses untracked ones): applied once per server connection. Keep
;; statement_timeout equal to the app's DB_STATEMENT_TIMEOUT_MS.
hookrelay = host=postgres port=5432 dbname=hookrelay connect_query='SET statement_timeout = 15000; SET idle_in_transaction_session_timeout = 60000'

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

;; Clients authenticate with SCRAM against userlist.txt; PgBouncer reuses that password
;; for the server login.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; A server connection belongs to a client for one transaction only. hookrelay keeps no
;; session state (no LISTEN, session advisory locks, session SET or temp tables; a unit test
;; audits this), so transaction pooling is safe.
pool_mode = transaction

;; Server connections per (database, user): the real Postgres budget. Clients (every process's
;; SQLAlchemy pool) may far exceed it; they queue here for at most query_wait_timeout.
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 2
max_db_connections = 40
max_client_conn = 1000
query_wait_timeout = 15

;; Protocol-level prepared statements (PgBouncer >= 1.21). With DB_PGBOUNCER=true the app
;; already uses uniquely named, uncached statements, so this only bounds the per-server cache.
max_prepared_statements = 200

server_lifetime = 3600
server_idle_timeout = 600
idle_transaction_timeout = 60
;; asyncpg sends this; it is harmless to drop.
ignore_startup_parameters = extra_float_digits

log_connections = 0
log_disconnections = 0
stats_period = 60
