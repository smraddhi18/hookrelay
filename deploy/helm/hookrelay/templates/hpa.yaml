{{- if and .Values.api.enabled .Values.api.autoscaling.enabled }}
{{- $a := .Values.api.autoscaling }}
# The API is stateless and CPU-bound per request (auth, JSON canonicalisation, one INSERT
# transaction), so CPU utilisation against requests is a good proxy for load.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "hookrelay.fullname" . }}-api
  labels:
    {{- include "hookrelay.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "hookrelay.fullname" . }}-api
  minReplicas: {{ $a.minReplicas }}
  maxReplicas: {{ $a.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $a.targetCPUUtilizationPercentage }}
  {{- with $a.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
