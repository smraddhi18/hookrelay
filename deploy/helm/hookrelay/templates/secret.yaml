{{- if not .Values.secrets.existingSecret }}
{{- /* Development / CI only: production should use secrets.existingSecret. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hookrelay.secretName" . }}
  labels:
    {{- include "hookrelay.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}
