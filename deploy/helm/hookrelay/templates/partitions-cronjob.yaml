{{- if .Values.partitions.enabled }}
{{- include "hookrelay.validate" . }}
{{- $r := .Values.partitions }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "hookrelay.fullname" . }}-partitions
  labels:
    {{- include "hookrelay.componentLabels" (dict "ctx" . "component" "partitions") | nindent 4 }}
spec:
  schedule: {{ $r.schedule | quote }}
  {{- with $r.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  # Premake / retire delivery_attempts partitions (Milestone 9c). Runs hourly: every step is
  # idempotent and an advisory lock makes an overlapping run a no-op anyway. Connects with
  # DATABASE_DIRECT_URL when DB_PGBOUNCER=true (session advisory lock, DETACH CONCURRENTLY).
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: {{ $r.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $r.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ $r.backoffLimit }}
      activeDeadlineSeconds: {{ $r.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "hookrelay.componentLabels" (dict "ctx" . "component" "partitions") | nindent 12 }}
          annotations:
            {{- include "hookrelay.checksums" . | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "hookrelay.serviceAccountName" . }}
          automountServiceAccountToken: false
          # No Kubernetes service-link env vars ({SVC}_PORT=tcp://...): they collide with
          # settings (a Service named "metrics" would set METRICS_PORT). DNS is the discovery path.
          enableServiceLinks: false
          {{- include "hookrelay.podSecurity" . | nindent 10 }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: partitions
              image: {{ include "hookrelay.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["hookrelay-partitions"]
              envFrom:
                {{- include "hookrelay.envFrom" . | nindent 16 }}
              resources:
                {{- toYaml $r.resources | nindent 16 }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              volumeMounts:
                {{- include "hookrelay.tmpMount" . | nindent 16 }}
          volumes:
            {{- include "hookrelay.tmpVolume" . | nindent 12 }}
{{- end }}
