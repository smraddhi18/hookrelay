# Local stack: Postgres 16 + Redis 7 + a one-shot migration job + the API.
#   docker compose up --build        -> http://localhost:8000/docs
#   docker compose down -v           -> stop and wipe data
name: hookrelay

x-app-env: &app-env
  APP_ENV: production
  LOG_FORMAT: json
  LOG_LEVEL: INFO
  DOCS_ENABLED: "true"
  DATABASE_URL: postgresql+asyncpg://hookrelay:hookrelay@postgres:5432/hookrelay
  REDIS_URL: redis://redis:6379/0
  # Local-stack defaults only; export real values in your shell (or .env) to override.
  OPERATOR_TOKEN: ${OPERATOR_TOKEN:-local-operator-token-change-me-0123456789}
  SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-bG9jYWwtY29tcG9zZS1rZXktbm90LWZvci1wcm9kISE}
  SECRETS_ENCRYPTION_KEY_PREVIOUS: ${SECRETS_ENCRYPTION_KEY_PREVIOUS:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hookrelay
      POSTGRES_PASSWORD: hookrelay
      POSTGRES_DB: hookrelay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookrelay -d hookrelay"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    image: hookrelay:local
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: hookrelay:local
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  pgdata:
  redisdata:
