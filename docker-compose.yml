# Local stack: Postgres 16 + PgBouncer (transaction pooling) + Redis 7 + a one-shot migration job
# + the API + the fan-out relay + the delivery worker + Prometheus / Grafana / Jaeger
# (+ an on-demand retention job, profile "ops").
# The API, relays and workers reach Postgres through PgBouncer (DB_PGBOUNCER=true); migrations
# go straight to Postgres (DATABASE_DIRECT_URL). To bypass the pooler, set
# HOOKRELAY_DATABASE_URL=postgresql+asyncpg://hookrelay:hookrelay@postgres:5432/hookrelay and
# DB_PGBOUNCER=false.
#   docker compose up --build        -> http://localhost:8000/docs
#   Prometheus http://localhost:9090  Grafana http://localhost:3000  Jaeger http://localhost:16686
#   docker compose down -v           -> stop and wipe data
name: hookrelay

x-app-env: &app-env
  APP_ENV: production
  LOG_FORMAT: json
  LOG_LEVEL: INFO
  DOCS_ENABLED: "true"
  DATABASE_URL: ${HOOKRELAY_DATABASE_URL:-postgresql+asyncpg://hookrelay:hookrelay@pgbouncer:6432/hookrelay}
  DB_PGBOUNCER: ${DB_PGBOUNCER:-true}
  DATABASE_DIRECT_URL: postgresql+asyncpg://hookrelay:hookrelay@postgres:5432/hookrelay
  WORKER_COMPLETE_BATCH_MAX: ${WORKER_COMPLETE_BATCH_MAX:-32}
  WORKER_COMPLETE_BATCH_LINGER_MS: ${WORKER_COMPLETE_BATCH_LINGER_MS:-5}
  REDIS_URL: redis://redis:6379/0
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-hookrelay}
  REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-1000}
  REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-500}
  REDIS_RECONNECT_BASE_MS: ${REDIS_RECONNECT_BASE_MS:-100}
  REDIS_RECONNECT_MAX_MS: ${REDIS_RECONNECT_MAX_MS:-5000}
  REDIS_REQUIRED_FOR_READY: ${REDIS_REQUIRED_FOR_READY:-false}
  WAKEUP_COALESCE_MS: ${WAKEUP_COALESCE_MS:-50}
  SUBSCRIPTION_CACHE_TTL_S: ${SUBSCRIPTION_CACHE_TTL_S:-60}
  # Local-stack defaults only; export real values in your shell (or .env) to override.
  OPERATOR_TOKEN: ${OPERATOR_TOKEN:-EXAMPLE-local-only-not-for-prod-operator-token}
  # Fake local-only defaults. The key is base64url of the text "EXAMPLE-local-only-not-for-prod!".
  SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-RVhBTVBMRS1sb2NhbC1vbmx5LW5vdC1mb3ItcHJvZCE}
  SECRETS_ENCRYPTION_KEY_PREVIOUS: ${SECRETS_ENCRYPTION_KEY_PREVIOUS:-}
  EVENT_MAX_PAYLOAD_BYTES: ${EVENT_MAX_PAYLOAD_BYTES:-262144}
  EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-30}
  IDEMPOTENCY_KEY_TTL_S: ${IDEMPOTENCY_KEY_TTL_S:-86400}
  IDEMPOTENCY_LOCK_TIMEOUT_MS: ${IDEMPOTENCY_LOCK_TIMEOUT_MS:-2000}
  RELAY_BATCH_SIZE: ${RELAY_BATCH_SIZE:-100}
  RELAY_POLL_MIN_MS: ${RELAY_POLL_MIN_MS:-100}
  RELAY_POLL_MAX_MS: ${RELAY_POLL_MAX_MS:-2000}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-16}
  WORKER_LEASE_S: ${WORKER_LEASE_S:-60}
  WORKER_DRAIN_TIMEOUT_S: ${WORKER_DRAIN_TIMEOUT_S:-25}
  DELIVERY_MAX_ATTEMPTS: ${DELIVERY_MAX_ATTEMPTS:-8}
  DELIVERY_MAX_AGE_S: ${DELIVERY_MAX_AGE_S:-259200}
  DELIVERY_ALLOWED_PORTS: ${DELIVERY_ALLOWED_PORTS:-80,443,8080,8443}
  ENDPOINT_DEFAULT_MAX_IN_FLIGHT: ${ENDPOINT_DEFAULT_MAX_IN_FLIGHT:-10}
  BREAKER_FAILURE_THRESHOLD: ${BREAKER_FAILURE_THRESHOLD:-5}
  BREAKER_COOLDOWN_BASE_S: ${BREAKER_COOLDOWN_BASE_S:-30}
  ENDPOINT_AUTO_DISABLE_AFTER_S: ${ENDPOINT_AUTO_DISABLE_AFTER_S:-259200}
  REPLAY_RATE_LIMIT_PER_MINUTE: ${REPLAY_RATE_LIMIT_PER_MINUTE:-30}
  ENDPOINT_SECRET_ROTATION_OVERLAP_S: ${ENDPOINT_SECRET_ROTATION_OVERLAP_S:-86400}
  ENDPOINT_HEALTH_MAX_WINDOW_S: ${ENDPOINT_HEALTH_MAX_WINDOW_S:-604800}
  EVENT_PAYLOAD_RETENTION_DAYS: ${EVENT_PAYLOAD_RETENTION_DAYS:-0}
  RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-500}
  RETENTION_MAX_BATCHES: ${RETENTION_MAX_BATCHES:-200}
  # Observability (Milestone 7). /metrics is public; set METRICS_TOKEN to require a bearer.
  METRICS_ENABLED: ${METRICS_ENABLED:-true}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
  TRACING_SAMPLE_RATIO: ${TRACING_SAMPLE_RATIO:-1}
  DASHBOARD_DEFAULT_WINDOW_S: ${DASHBOARD_DEFAULT_WINDOW_S:-3600}
  DASHBOARD_MAX_WINDOW_S: ${DASHBOARD_MAX_WINDOW_S:-604800}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hookrelay
      POSTGRES_PASSWORD: hookrelay
      POSTGRES_DB: hookrelay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookrelay -d hookrelay"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Transaction pooling (Milestone 9): many client connections (every process's SQLAlchemy
  # pool) share default_pool_size server connections. Config: deploy/pgbouncer/pgbouncer.ini.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    volumes:
      - ./deploy/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./deploy/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432", "-U", "hookrelay"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    image: hookrelay:local
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: hookrelay:local
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  # Drains the transactional outbox into deliveries. Scale out freely
  # (`docker compose up --scale relay=3`): relays claim disjoint batches with SKIP LOCKED.
  relay:
    image: hookrelay:local
    command: ["python", "-m", "hookrelay.relay"]
    environment:
      <<: *app-env
      METRICS_PORT: ${RELAY_METRICS_PORT:-9101}
    ports:
      - "${RELAY_METRICS_PORT:-9101}:9101"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    # The image's default probe checks the API port; the relay has none, so it proves
    # liveness through a heartbeat file touched on every polling iteration.
    healthcheck:
      test: ["CMD", "python", "-m", "hookrelay.relay", "--healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s

  # Leases due deliveries (SKIP LOCKED + fencing tokens), signs and POSTs them, records every
  # attempt and schedules retries. Scale out freely (`docker compose up --scale worker=4`).
  # Production mode keeps the SSRF guard strict: only public addresses on allowed ports.
  worker:
    image: hookrelay:local
    command: ["python", "-m", "hookrelay.worker"]
    environment:
      <<: *app-env
      METRICS_PORT: ${WORKER_METRICS_PORT:-9102}
    ports:
      - "${WORKER_METRICS_PORT:-9102}:9102"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "hookrelay.worker", "--healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    # SIGTERM drains in-flight attempts for WORKER_DRAIN_TIMEOUT_S (25 s), then releases leases.
    stop_grace_period: 30s

  # One-shot retention run (expired events, payload purge, ended secret overlaps), for a cron
  # or Kubernetes CronJob: `docker compose run --rm retention`. The relay already runs one
  # bounded pass per housekeeping interval, so this is optional; concurrent runs are safe.
  retention:
    image: hookrelay:local
    command: ["python", "-m", "hookrelay.retention"]
    environment: *app-env
    profiles: ["ops"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    restart: "no"


  # Observability stack (Milestone 7). Always-on and lightweight; scrape api/relay/worker.
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-EXAMPLE-local-only-not-for-prod}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped

  # Jaeger all-in-one: OTLP HTTP on 4318, UI on 16686.
  jaeger:
    image: jaegertracing/all-in-one:1.62
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  prometheusdata:
  grafanadata:
