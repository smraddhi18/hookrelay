name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.13.6"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  test:
    name: Migrations & tests (Postgres 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hookrelay
          POSTGRES_PASSWORD: hookrelay
          POSTGRES_DB: hookrelay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hookrelay -d hookrelay"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      APP_ENV: test
      LOG_FORMAT: json
      DATABASE_URL: postgresql+asyncpg://hookrelay:hookrelay@localhost:5432/hookrelay
      TEST_DATABASE_URL: postgresql://hookrelay:hookrelay@localhost:5432/hookrelay
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: alembic upgrade head
        run: uv run alembic upgrade head
      - name: alembic upgrade head (idempotent re-run)
        run: uv run alembic upgrade head
      - name: alembic check (models match migrations)
        run: uv run alembic check
      - name: alembic downgrade base / upgrade head roundtrip
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: pytest (unit + integration)
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Fail if integration tests were skipped
        run: |
          uv run pytest tests/integration -q -rs | tee integration.log
          if grep -q "SKIPPED" integration.log; then echo "integration tests were skipped" >&2; exit 1; fi

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hookrelay
          POSTGRES_PASSWORD: hookrelay
          POSTGRES_DB: hookrelay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hookrelay -d hookrelay"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://hookrelay:hookrelay@127.0.0.1:5432/hookrelay
      # Throwaway CI-only values: the image runs with APP_ENV=production, which requires a key.
      SECRETS_ENCRYPTION_KEY: Y2ktb25seS1rZXktY2ktb25seS1rZXktY2ktb25seSE
      OPERATOR_TOKEN: ci-operator-token-0123456789abcdefghij
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build --tag hookrelay:ci .
      - name: Image runs as non-root
        run: test "$(docker run --rm hookrelay:ci id -u)" = "10001"
      - name: Migrations from the image
        run: docker run --rm --network host -e DATABASE_URL -e SECRETS_ENCRYPTION_KEY hookrelay:ci alembic upgrade head
      - name: API from the image answers /health and /ready
        run: |
          docker run -d --name hookrelay-api --network host \
            -e DATABASE_URL -e SECRETS_ENCRYPTION_KEY -e OPERATOR_TOKEN hookrelay:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready; then echo; break; fi
            sleep 1
          done
          curl -fsS -H 'X-Request-ID: ci-smoke' -D - http://127.0.0.1:8000/health | tee headers.txt
          grep -qi '^x-request-id: ci-smoke' headers.txt
          curl -fsS http://127.0.0.1:8000/ready
          docker exec hookrelay-api python -m hookrelay.healthcheck
      - name: API from the image enforces auth and serves the tenant API
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/v1/endpoints)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer wrong' \
            http://127.0.0.1:8000/admin/tenants)" = "401"
          curl -fsS -X POST http://127.0.0.1:8000/admin/tenants \
            -H "Authorization: Bearer ${OPERATOR_TOKEN}" -H 'Content-Type: application/json' \
            -d '{"slug": "ci-smoke", "name": "CI smoke"}' -o tenant.json
          grep -q '"slug":"ci-smoke"' tenant.json
      - name: Publish an event (with idempotent replay) and fan it out with the relay image
        run: |
          API=http://127.0.0.1:8000
          JSON='Content-Type: application/json'
          TENANT_ID="$(jq -r .id tenant.json)"
          KEY="$(curl -fsS -X POST "$API/admin/tenants/$TENANT_ID/api-keys" \
            -H "Authorization: Bearer ${OPERATOR_TOKEN}" -H "$JSON" \
            -d '{"name": "ci", "role": "admin"}' | jq -r .key)"
          AUTH="Authorization: Bearer $KEY"
          curl -fsS -X POST "$API/v1/event-types" -H "$AUTH" -H "$JSON" -d '{"name": "ci.smoke"}'
          ENDPOINT_ID="$(curl -fsS -X POST "$API/v1/endpoints" -H "$AUTH" -H "$JSON" \
            -d '{"url": "https://hooks.example.com/ci"}' | jq -r .id)"
          curl -fsS -X POST "$API/v1/endpoints/$ENDPOINT_ID/subscriptions" -H "$AUTH" -H "$JSON" \
            -d '{"event_type": "ci.*"}'
          EVENT='{"event_type": "ci.smoke", "payload": {"ok": true}}'
          test "$(curl -s -o event.json -w '%{http_code}' -X POST "$API/v1/events" -H "$AUTH" \
            -H "$JSON" -H 'Idempotency-Key: ci-smoke-1' -d "$EVENT")" = "202"
          EVENT_ID="$(jq -r .id event.json)"
          curl -fsS -D replay.txt -o replay.json -X POST "$API/v1/events" -H "$AUTH" -H "$JSON" \
            -H 'Idempotency-Key: ci-smoke-1' -d "$EVENT"
          grep -qi '^idempotent-replayed: true' replay.txt
          test "$(jq -r .id replay.json)" = "$EVENT_ID"
          docker run --rm --network host -e DATABASE_URL -e SECRETS_ENCRYPTION_KEY hookrelay:ci \
            python -m hookrelay.relay --once
          curl -fsS "$API/v1/events/$EVENT_ID/deliveries" -H "$AUTH" | tee deliveries.json
          test "$(jq '.data | length' deliveries.json)" = "1"
          test "$(jq -r '.data[0].endpoint_id' deliveries.json)" = "$ENDPOINT_ID"
          test "$(jq -r '.data[0].status' deliveries.json)" = "pending"
      - name: Relay loop from the image heartbeats and stops cleanly on SIGTERM
        run: |
          docker run -d --name hookrelay-relay --network host \
            -e DATABASE_URL -e SECRETS_ENCRYPTION_KEY hookrelay:ci python -m hookrelay.relay
          for i in $(seq 1 20); do
            if docker exec hookrelay-relay python -m hookrelay.relay --healthcheck; then break; fi
            sleep 1
          done
          docker exec hookrelay-relay python -m hookrelay.relay --healthcheck
          docker stop --time 20 hookrelay-relay
          test "$(docker inspect -f '{{.State.ExitCode}}' hookrelay-relay)" = "0"
          docker logs hookrelay-relay 2>&1 | grep -q '"event": "relay.stopped"'
      - name: Container logs
        if: always()
        run: |
          docker logs hookrelay-api || true
          docker logs hookrelay-relay || true
