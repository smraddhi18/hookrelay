name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.13.6"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  test:
    name: Migrations & tests (Postgres 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hookrelay
          POSTGRES_PASSWORD: hookrelay
          POSTGRES_DB: hookrelay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hookrelay -d hookrelay"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      APP_ENV: test
      LOG_FORMAT: json
      DATABASE_URL: postgresql+asyncpg://hookrelay:hookrelay@localhost:5432/hookrelay
      TEST_DATABASE_URL: postgresql://hookrelay:hookrelay@localhost:5432/hookrelay
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: alembic upgrade head
        run: uv run alembic upgrade head
      - name: alembic upgrade head (idempotent re-run)
        run: uv run alembic upgrade head
      - name: alembic check (models match migrations)
        run: uv run alembic check
      - name: alembic downgrade base / upgrade head roundtrip
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: pytest (unit + integration)
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Fail if integration tests were skipped
        run: |
          uv run pytest tests/integration -q -rs | tee integration.log
          if grep -q "SKIPPED" integration.log; then echo "integration tests were skipped" >&2; exit 1; fi

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hookrelay
          POSTGRES_PASSWORD: hookrelay
          POSTGRES_DB: hookrelay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hookrelay -d hookrelay"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://hookrelay:hookrelay@127.0.0.1:5432/hookrelay
      # Throwaway CI-only values: the image runs with APP_ENV=production, which requires a key.
      SECRETS_ENCRYPTION_KEY: Y2ktb25seS1rZXktY2ktb25seS1rZXktY2ktb25seSE
      OPERATOR_TOKEN: ci-operator-token-0123456789abcdefghij
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build --tag hookrelay:ci .
      - name: Image runs as non-root
        run: test "$(docker run --rm hookrelay:ci id -u)" = "10001"
      - name: Migrations from the image
        run: docker run --rm --network host -e DATABASE_URL -e SECRETS_ENCRYPTION_KEY hookrelay:ci alembic upgrade head
      - name: API from the image answers /health and /ready
        run: |
          # The smoke receiver runs on the runner's loopback, so this API may register it.
          docker run -d --name hookrelay-api --network host \
            -e DATABASE_URL -e SECRETS_ENCRYPTION_KEY -e OPERATOR_TOKEN \
            -e ENDPOINT_ALLOW_HTTP=true -e ENDPOINT_ALLOW_PRIVATE_NETWORKS=true hookrelay:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready; then echo; break; fi
            sleep 1
          done
          curl -fsS -H 'X-Request-ID: ci-smoke' -D - http://127.0.0.1:8000/health | tee headers.txt
          grep -qi '^x-request-id: ci-smoke' headers.txt
          curl -fsS http://127.0.0.1:8000/ready
          docker exec hookrelay-api python -m hookrelay.healthcheck
      - name: API from the image enforces auth and serves the tenant API
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/v1/endpoints)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer wrong' \
            http://127.0.0.1:8000/admin/tenants)" = "401"
          curl -fsS -X POST http://127.0.0.1:8000/admin/tenants \
            -H "Authorization: Bearer ${OPERATOR_TOKEN}" -H 'Content-Type: application/json' \
            -d '{"slug": "ci-smoke", "name": "CI smoke"}' -o tenant.json
          grep -q '"slug":"ci-smoke"' tenant.json
      - name: Start a mock webhook receiver on the runner
        run: |
          mkdir -p received
          cat > receiver.py <<'PY'
          import json, pathlib
          from http.server import BaseHTTPRequestHandler, HTTPServer

          OUT = pathlib.Path("received")

          class Hook(BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers.get("Content-Length", "0")))
                  n = len(list(OUT.glob("*.json"))) + 1
                  (OUT / f"{n}.body").write_bytes(body)
                  headers = {k.lower(): v for k, v in self.headers.items()}
                  (OUT / f"{n}.json").write_text(json.dumps({"path": self.path, "headers": headers}))
                  self.send_response(204)
                  self.end_headers()

          HTTPServer(("127.0.0.1", 8080), Hook).serve_forever()
          PY
          nohup python3 receiver.py > receiver.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -s -o /dev/null http://127.0.0.1:8080/; then break; fi
            sleep 0.5
          done
      - name: Publish an event (with idempotent replay) and fan it out with the relay image
        run: |
          API=http://127.0.0.1:8000
          JSON='Content-Type: application/json'
          TENANT_ID="$(jq -r .id tenant.json)"
          KEY="$(curl -fsS -X POST "$API/admin/tenants/$TENANT_ID/api-keys" \
            -H "Authorization: Bearer ${OPERATOR_TOKEN}" -H "$JSON" \
            -d '{"name": "ci", "role": "admin"}' | jq -r .key)"
          AUTH="Authorization: Bearer $KEY"
          curl -fsS -X POST "$API/v1/event-types" -H "$AUTH" -H "$JSON" -d '{"name": "ci.smoke"}'
          curl -fsS -X POST "$API/v1/endpoints" -H "$AUTH" -H "$JSON" \
            -d '{"url": "http://127.0.0.1:8080/hook"}' -o endpoint.json
          ENDPOINT_ID="$(jq -r .id endpoint.json)"
          echo "$KEY" > api-key.txt
          curl -fsS -X POST "$API/v1/endpoints/$ENDPOINT_ID/subscriptions" -H "$AUTH" -H "$JSON" \
            -d '{"event_type": "ci.*"}'
          EVENT='{"event_type": "ci.smoke", "payload": {"ok": true}}'
          test "$(curl -s -o event.json -w '%{http_code}' -X POST "$API/v1/events" -H "$AUTH" \
            -H "$JSON" -H 'Idempotency-Key: ci-smoke-1' -d "$EVENT")" = "202"
          EVENT_ID="$(jq -r .id event.json)"
          curl -fsS -D replay.txt -o replay.json -X POST "$API/v1/events" -H "$AUTH" -H "$JSON" \
            -H 'Idempotency-Key: ci-smoke-1' -d "$EVENT"
          grep -qi '^idempotent-replayed: true' replay.txt
          test "$(jq -r .id replay.json)" = "$EVENT_ID"
          docker run --rm --network host -e DATABASE_URL -e SECRETS_ENCRYPTION_KEY hookrelay:ci \
            python -m hookrelay.relay --once
          curl -fsS "$API/v1/events/$EVENT_ID/deliveries" -H "$AUTH" | tee deliveries.json
          test "$(jq '.data | length' deliveries.json)" = "1"
          test "$(jq -r '.data[0].endpoint_id' deliveries.json)" = "$ENDPOINT_ID"
          test "$(jq -r '.data[0].status' deliveries.json)" = "pending"
      - name: Worker from the image delivers the signed webhook and records the attempt
        run: |
          API=http://127.0.0.1:8000
          AUTH="Authorization: Bearer $(cat api-key.txt)"
          # Development mode is the only one that may target the loopback receiver: production
          # refuses DELIVERY_ALLOW_PRIVATE_NETWORKS (SSRF guard). ENDPOINT_ALLOW_HTTP lets the
          # worker send to the plain-http receiver too.
          docker run --rm --network host -e DATABASE_URL -e SECRETS_ENCRYPTION_KEY \
            -e APP_ENV=development -e LOG_FORMAT=json -e ENDPOINT_ALLOW_HTTP=true \
            -e DELIVERY_ALLOW_PRIVATE_NETWORKS=true \
            hookrelay:ci python -m hookrelay.worker --once
          DELIVERY_ID="$(jq -r '.data[0].id' deliveries.json)"
          curl -fsS "$API/v1/deliveries/$DELIVERY_ID" -H "$AUTH" | tee delivery.json
          test "$(jq -r .status delivery.json)" = "succeeded"
          test "$(jq -r .attempt_count delivery.json)" = "1"
          test "$(jq -r .last_status_code delivery.json)" = "204"
          curl -fsS "$API/v1/deliveries/$DELIVERY_ID/attempts" -H "$AUTH" | tee attempts.json
          test "$(jq '.data | length' attempts.json)" = "1"
          test "$(jq -r '.data[0].outcome' attempts.json)" = "succeeded"
          test "$(jq -r '.data[0].request_headers["webhook-signature"]' attempts.json)" = "v1,[redacted]"
          test "$(ls received/*.json | wc -l)" = "1"
          test "$(jq -r .path received/1.json)" = "/hook"
          # Verify the Standard Webhooks signature with the library receivers can copy.
          docker run --rm -v "$PWD:/smoke:ro" hookrelay:ci python -c '
          import json
          from hookrelay.core.signing import verify
          secret = json.load(open("/smoke/endpoint.json"))["signing_secret"]
          headers = json.load(open("/smoke/received/1.json"))["headers"]
          body = open("/smoke/received/1.body", "rb").read()
          event_id = json.load(open("/smoke/event.json"))["id"]
          assert verify(secret, headers, body) == event_id, "webhook-id is not the event id"
          webhook = json.loads(body)
          assert webhook["type"] == "ci.smoke" and webhook["data"] == {"ok": True}, webhook
          print("signature verified for", event_id)
          '
      - name: Worker loop from the image heartbeats and stops cleanly on SIGTERM
        run: |
          docker run -d --name hookrelay-worker --network host \
            -e DATABASE_URL -e SECRETS_ENCRYPTION_KEY hookrelay:ci python -m hookrelay.worker
          for i in $(seq 1 20); do
            if docker exec hookrelay-worker python -m hookrelay.worker --healthcheck; then break; fi
            sleep 1
          done
          docker exec hookrelay-worker python -m hookrelay.worker --healthcheck
          docker stop --time 35 hookrelay-worker
          test "$(docker inspect -f '{{.State.ExitCode}}' hookrelay-worker)" = "0"
          docker logs hookrelay-worker 2>&1 | grep -q '"event": "worker.stopped"'
      - name: Relay loop from the image heartbeats and stops cleanly on SIGTERM
        run: |
          docker run -d --name hookrelay-relay --network host \
            -e DATABASE_URL -e SECRETS_ENCRYPTION_KEY hookrelay:ci python -m hookrelay.relay
          for i in $(seq 1 20); do
            if docker exec hookrelay-relay python -m hookrelay.relay --healthcheck; then break; fi
            sleep 1
          done
          docker exec hookrelay-relay python -m hookrelay.relay --healthcheck
          docker stop --time 20 hookrelay-relay
          test "$(docker inspect -f '{{.State.ExitCode}}' hookrelay-relay)" = "0"
          docker logs hookrelay-relay 2>&1 | grep -q '"event": "relay.stopped"'
      - name: Container logs
        if: always()
        run: |
          docker logs hookrelay-api || true
          docker logs hookrelay-relay || true
          docker logs hookrelay-worker || true
          cat receiver.log || true
